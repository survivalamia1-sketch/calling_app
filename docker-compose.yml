version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: videocall-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-videocall}
      POSTGRES_USER: ${DB_USER:-videocall}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-videocall_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # - ./backend/migrations:/docker-entrypoint-initdb.d  # Commented out to avoid directory sharing issues
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-videocall}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - videocall-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: videocall-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - videocall-network

  # Go Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: videocall-backend
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-videocall}
      - DB_USER=${DB_USER:-videocall}
      - DB_PASSWORD=${DB_PASSWORD:-videocall_password}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production}
      # TurboSMTP Email Configuration
      - SMTP_HOST=${SMTP_HOST:-pro.turbo-smtp.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-noreply@videocall.com}
      - SMTP_USE_SSL=${SMTP_USE_SSL:-false}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
      - SMTP_SKIP_VERIFY=${SMTP_SKIP_VERIFY:-false}
      # Stripe Configuration
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      # Application URLs
      - APP_URL=${APP_URL:-http://localhost:3000}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - videocall-network
    restart: unless-stopped

  # Next.js Admin Dashboard
  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
    container_name: videocall-admin
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:8080/ws}
    ports:
      - "3001:3000"
    depends_on:
      - backend
    networks:
      - videocall-network
    restart: unless-stopped

  # Nginx Reverse Proxy (Production)
  nginx:
    image: nginx:alpine
    container_name: videocall-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - admin
    networks:
      - videocall-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  videocall-network:
    driver: bridge
