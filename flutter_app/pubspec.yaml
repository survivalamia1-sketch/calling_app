name: calling_app
description: A video calling SaaS application with subscriptions
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1

  # HTTP & API
  http: ^1.1.0
  dio: ^5.4.0

  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # WebRTC
  flutter_webrtc: ^0.9.46

  # WebSocket
  web_socket_channel: ^2.4.0
  socket_io_client: ^2.0.3

  # UI Components
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0

  # Forms & Validation
  flutter_form_builder: ^9.1.1
  form_builder_validators: ^9.1.0

  # Date & Time
  intl: ^0.18.1

  # Navigation
  go_router: ^12.1.3

  # Payments (Stripe)
  flutter_stripe: ^10.1.1

  # Permissions
  permission_handler: ^11.1.0

  # Image Picker
  image_picker: ^1.0.5

  # URL Launcher
  url_launcher: ^6.2.2

  # Toast/Snackbar
  fluttertoast: ^8.2.4

  # Loading
  flutter_spinkit: ^5.2.0

  # QR Code
  qr_flutter: ^4.1.0
  qr_code_scanner: ^1.0.1

  # Lottie Animations
  lottie: ^2.7.0

  # Utils
  uuid: ^4.2.2
  package_info_plus: ^5.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
